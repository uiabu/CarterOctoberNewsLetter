<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>July Newsletter</title>
  </head>

  <body style="margin: 0; padding: 0; background: #f4f4f4">
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      bgcolor="#f4f4f4"
    >
      <tr>
        <td align="center">
          <!-- MAIN CONTAINER -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 600px; width: 100%; background: #ffffff"
          >
            <!-- IMAGE 1 -->
            <tr>
              <td align="center" style="padding: 0">
                <img
                  src="https://bayshore.nyc3.cdn.digitaloceanspaces.com/Email_Template/carter-dm-1.png"
                  width="600"
                  style="
                    width: 100%;
                    max-width: 600px;
                    height: auto;
                    display: block;
                    border: 0;
                  "
                  alt="Newsletter Image 1"
                />
              </td>
            </tr>

            <!-- IMAGE 2 -->
            <tr>
              <td align="center" style="padding: 0">
                <img
                  src="https://bayshore.nyc3.cdn.digitaloceanspaces.com/Email_Template/carter-dm-2.png"
                  width="600"
                  style="
                    width: 100%;
                    max-width: 600px;
                    height: auto;
                    display: block;
                    border: 0;
                  "
                  alt="Newsletter Image 2"
                />
              </td>
            </tr>

            <!-- IMAGE 3 -->
            <tr>
              <td align="center" style="padding: 0">
                <img
                  src="https://bayshore.nyc3.cdn.digitaloceanspaces.com/Email_Template/carter-dm-3.png"
                  width="600"
                  style="
                    width: 100%;
                    max-width: 600px;
                    height: auto;
                    display: block;
                    border: 0;
                  "
                  alt="Newsletter Image 3"
                />
              </td>
            </tr>

            <!-- IMAGE 4 -->
            <!-- BLOG / VIDEO SECTION -->
            <tr>
              <td
                align="center"
                background="https://bayshore.nyc3.cdn.digitaloceanspaces.com/Email_Template/carter-dm-blog-bg.png"
                bgcolor="#1b0b47"
                style="
                  background-image: url(&quot;https://bayshore.nyc3.cdn.digitaloceanspaces.com/Email_Template/carter-dm-blog-bg.png&quot;);
                  background-size: cover;
                  background-position: center top;
                  background-repeat: no-repeat;
                  padding: 40px 20px;
                "
              >
                <!-- Card -->
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="560"
                  style="
                    width: 100%;
                    max-width: 560px;
                    background: #ffffff;
                    border-radius: 18px;
                    overflow: hidden;
                  "
                >
                  <!-- Top Image -->
                  <tr>
                    <td>
                      <img
                        src="https://bayshore.nyc3.cdn.digitaloceanspaces.com/Email_Template/carter-dm-4.png"
                        width="560"
                        alt="Latest Blogs & Videos"
                        style="
                          display: block;
                          width: 100%;
                          max-width: 560px;
                          height: auto;
                          border: 0;
                        "
                      />
                    </td>
                  </tr>

                  <!-- CTA -->
                  <tr>
                    <td align="center" style="padding: 28px 25px 35px">
                      <a
                        href="https://carterinjurylaw.com/blog/"
                        style="
                          background: #ef2028;
                          color: #ffffff;
                          text-decoration: none;
                          display: inline-block;
                          padding: 14px 38px;
                          font-size: 16px;
                          font-family: Arial, Helvetica, sans-serif;
                          font-weight: bold;
                          border-radius: 8px;
                          letter-spacing: 0.5px;
                        "
                      >
                        READ MORE ARTICLES
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- IMAGE 5 -->
            <tr>
              <td align="center" style="padding: 0">
                <img
                  src="https://bayshore.nyc3.cdn.digitaloceanspaces.com/Email_Template/carter-dm-5.png"
                  width="600"
                  style="
                    width: 100%;
                    max-width: 600px;
                    height: auto;
                    display: block;
                    border: 0;
                  "
                  alt="Newsletter Image 5"
                />
              </td>
            </tr>

            <!-- IMAGE 6 -->
            <tr>
              <td align="center" style="padding: 0">
                <img
                  src="https://bayshore.nyc3.cdn.digitaloceanspaces.com/Email_Template/carter-dm-6.png"
                  width="600"
                  style="
                    width: 100%;
                    max-width: 600px;
                    height: auto;
                    display: block;
                    border: 0;
                  "
                  alt="Newsletter Image 6"
                />
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
